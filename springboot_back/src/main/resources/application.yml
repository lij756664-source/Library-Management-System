server:
  port: 8080

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/book_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.book.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: campus-book-borrow-system-jwt-secret-key-2024
  expiration: 86400000
